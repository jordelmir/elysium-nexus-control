# Gradle properties for the Elysium Nexus Android module.
# See ADR-0001.

# JVM args: keep module builds light; the canonical engine is in Kotlin
# and we want headroom for property tests.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Enable configuration cache; we keep build configuration small.
org.gradle.configuration-cache=true

# Parallel is on by default; we add explicit on for the small module count
# we have today.
org.gradle.parallel=true

# AndroidX is required for compileSdk 34.
android.useAndroidX=true

# Kotlin 2.2+ uses the K2 compiler. AGP 8.6+ supports it.
kotlin.code.style=official

# Non-transitive R class is faster and forces correct dependency
# boundaries.
android.nonTransitiveRClass=true
