name: Android CI (fast)

# V06-P35 — PR fast path (MASTER_ORDER §82–§86 Release Factory shape).
#
# Every pull request runs the CHEAP gates that catch 95% of breakage in
# minutes: catalog integrity, canonical hash, source lock, Python lint,
# device-matrix validation, JVM unit tests, androidTest compile coverage,
# Android lint. It deliberately does NOT run the release build (R8), SBOM
# or the emulator — those run on push (android-ci.yml) before a release is
# considered.
#
# Split rationale: PR churn should not burn 30-minute release-gate budget;
# the push job stays the authoritative full pipeline.

on:
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  fast:
    name: Fast gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # V06.2 P0-1: ir_catalog.db is tracked via Git LFS. checkout must
          # materialize real blobs (default lfs: false leaves 132-byte
          # pointer files that fail Gate 1).
          lfs: true

      - name: Git LFS sanity (fsck)
        run: |
          git lfs fsck
          # Both LFS-tracked assets must be present as real files.
          test -s apps/android/app/src/main/assets/ir/ir_catalog.db
          echo "lfs fsck: PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      # ── Gate 1: Catalog integrity (LFS blob + hash + size + quick_check + FK) ──
      - name: Verify IR catalog integrity
        run: |
          cd apps/android/app/src/main/assets/ir
          python3 - <<'PYEOF'
          import hashlib, json, os, sqlite3, sys
          db = "ir_catalog.db"
          manifest = json.load(open("ir_catalog.manifest.json"))
          # V06.2 P0-1: reject LFS pointer files — a real SQLite DB starts
          # with the 16-byte magic header "SQLite format 3\0".
          with open(db, "rb") as f:
              magic = f.read(16)
          pointer_ok = (magic == b"SQLite format 3\x00")
          size_ok = (os.path.getsize(db) == manifest.get("databaseSizeBytes"))
          sha = hashlib.sha256(open(db, "rb").read()).hexdigest()
          expected = manifest.get("databaseSha256")
          sha_ok = (expected is not None and sha == expected)
          con = sqlite3.connect(db)
          quick = con.execute("PRAGMA quick_check").fetchone()[0]
          fk = con.execute("PRAGMA foreign_key_check").fetchall()
          con.close()
          ok = pointer_ok and size_ok and sha_ok and (quick == "ok") and (len(fk) == 0)
          print(f"lfs-pointer check: {'PASS' if pointer_ok else 'FAIL'} (SQLite magic)")
          print(f"size check: {'PASS' if size_ok else 'FAIL'} ({os.path.getsize(db)} vs {manifest.get('databaseSizeBytes')})")
          print(f"hash check: {'PASS' if sha_ok else 'FAIL'}")
          print(f"quick_check: {quick}; fk: {len(fk)} violations")
          if not ok:
              print("FATAL: catalog integrity failed", file=sys.stderr)
              sys.exit(1)
          print("catalog integrity: PASS")
          PYEOF

      # ── Gate 2: Canonical hash reproducibility ──
      - name: Verify canonical content hash matches manifest
        run: |
          python3 - <<'PYEOF'
          import json, sys
          sys.path.insert(0, "${{ github.workspace }}/tools/ir-data")
          from export_canonical_catalog import compute_canonical_hash
          from pathlib import Path
          db_path = Path("apps/android/app/src/main/assets/ir/ir_catalog.db")
          manifest = json.load(open("apps/android/app/src/main/assets/ir/ir_catalog.manifest.json"))
          expected = manifest.get("canonicalContentSha256")
          actual, _ = compute_canonical_hash(db_path)
          if expected is None or actual != expected:
              print("FATAL: canonical hash mismatch", file=sys.stderr)
              sys.exit(1)
          print("canonical hash: PASS")
          PYEOF

      # ── Gate 3: Source lock schema (V06.2 P0-2 — single authority) ──
      # validate_source_lock_schema.py is THE one implementation of the
      # lock policy (kind=git vs kind=artifact). No inline YAML validators.
      - name: Validate source lock schema
        run: |
          python3 tools/ir-data/validate_source_lock_schema.py

      # ── Gate 3b: Catalog eligibility (V06-PTG-02 §3) ──
      - name: Enforce production catalog eligibility gate
        run: |
          python3 tools/ir-data/check_catalog_eligibility.py

      # ── Gate 4: Python lint ──
      - name: Lint Python scripts (ruff)
        run: |
          pip install --break-system-packages ruff 2>/dev/null || pip install ruff
          ruff check tools/ir-data/*.py --select E,F,W --ignore E501,W505,E402

      # ── Gate 5: Device-matrix validation (V06-P33) ──
      - name: Validate devices-under-test matrix
        run: |
          pip install --break-system-packages pyyaml 2>/dev/null || pip install pyyaml
          python3 tools/device-matrix/validate.py

      # ── Gate 5b: Documentation claims audit (V06-P37) ──
      - name: Audit docs for unproven claims
        run: |
          chmod +x tools/claims-audit/audit.sh
          ./tools/claims-audit/audit.sh

      # ── Gate 6: JVM unit tests ──
      - name: Run JVM unit tests
        run: |
          cd apps/android
          ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      # ── Gate 7: androidTest compile coverage (keeps the instrumented
      #    suite compiling without burning the emulator on every PR) ──
      - name: Compile instrumented tests
        run: |
          cd apps/android
          ./gradlew :app:compileDebugAndroidTestKotlin --console=plain --no-daemon

      # ── Gate 8: Android lint ──
      - name: Lint (abort on error)
        run: |
          cd apps/android
          ./gradlew :app:lintDebug --console=plain --no-daemon

      - name: Report test count
        if: always()
        run: |
          cd apps/android
          total=$(find app/build/test-results -name "*.xml" -exec grep -oE 'tests="[0-9]+"' {} \; | awk -F'"' '{sum+=$2} END {print sum}')
          echo "Total tests: $total"