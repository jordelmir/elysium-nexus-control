name: Android CI

# Phase 1.19+ — full green-build gates.
#
# `MASTER_ORDER.md` §44 calls for every change to be
# measured: the test suite, the build, the lint. The
# workflow runs the three green-build gates (test +
# assemble + lint) on every push and pull request,
# and verifies the IR catalog integrity (Schema v4,
# quick_check, foreign_key_check) so a bad asset can
# never be shipped silently.
#
# The workflow uses a single job (`build`) on the
# cheapest Linux runner. The Gradle build is cached
# across runs (the `gradle-build-action` key).
#
# The workflow checks out the repository with
# `fetch-depth: 0` so the CI run can attach the
# change-set to a future release note. The `actions/setup-java@v4`
# step installs the JDK 17 that matches the
# project's `jvmToolchain(17)` in `app/build.gradle.kts`.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      - name: Verify IR catalog integrity (quick_check + manifest hash)
        run: |
          cd apps/android/app/src/main/assets/ir
          python3 - <<'EOF'
          import hashlib, json, sqlite3, os
          db = "ir_catalog.db"
          sha = hashlib.sha256(open(db, "rb").read()).hexdigest()
          manifest = json.load(open("ir_catalog.manifest.json"))
          expected = manifest.get("databaseSha256")
          status = "PASS" if expected is None or sha == expected else "FAIL"
          print(f"catalog sha256   : {sha}")
          print(f"manifest expected: {expected}")
          print(f"hash check       : {status}")
          con = sqlite3.connect(db)
          quick = con.execute("PRAGMA quick_check").fetchone()[0]
          fk = con.execute("PRAGMA foreign_key_check").fetchall()
          print(f"quick_check      : {quick}")
          print(f"foreign_key_check: {len(fk)} violations")
          con.close()
          ok = (quick == "ok") and (len(fk) == 0) and (status == "PASS")
          if not ok:
              raise SystemExit(f"catalog integrity failed: quick={quick} fk={len(fk)} hash={status}")
          EOF

      - name: Lint Python scripts (ruff)
        run: |
          pip install ruff
          ruff check tools/ir-data/*.py --select E,F,W --ignore E501,W505

      - name: Run JVM unit tests
        run: |
          cd apps/android
          ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint (abort on error)
        run: |
          cd apps/android
          ./gradlew :app:lintDebug --console=plain

      - name: Build debug APK
        run: |
          cd apps/android
          ./gradlew :app:assembleDebug --console=plain

      - name: Build release APK (R8 minification)
        run: |
          cd apps/android
          ./gradlew :app:assembleRelease --console=plain

      - name: Generate SBOM (CycloneDX)
        run: |
          cd apps/android
          ./gradlew :app:cyclonedxDirectBom --console=plain
          cp app/build/reports/cyclonedx-direct/bom.xml "$GITHUB_WORKSPACE/sbom.xml" 2>/dev/null || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml
          if-no-files-found: warn
          retention-days: 90

      - name: Report test count
        if: always()
        run: |
          cd apps/android
          total=$(find app/build/test-results -name "*.xml" -exec grep -oE 'tests="[0-9]+"' {} \; | awk -F'"' '{sum+=$2} END {print sum}')
          echo "Total tests: $total"

  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
