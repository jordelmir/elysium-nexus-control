name: Android CI

# Elysium Nexus — Android CI pipeline
#
# Gates: catalog integrity → Python lint → JVM tests → Android lint →
#        debug build → release build (R8) → SBOM → instrumented tests.
#
# §44: every change must be measured. This workflow enforces that
# on every push and pull request to main/develop.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      # ── Gate 1: Catalog integrity ──
      - name: Verify IR catalog integrity (quick_check + manifest hash)
        run: |
          cd apps/android/app/src/main/assets/ir
          python3 - <<'PYEOF'
          import hashlib, json, sqlite3, sys
          db = "ir_catalog.db"
          sha = hashlib.sha256(open(db, "rb").read()).hexdigest()
          manifest = json.load(open("ir_catalog.manifest.json"))
          expected = manifest.get("databaseSha256")
          status = "PASS" if expected is None or sha == expected else "FAIL"
          print(f"catalog sha256   : {sha}")
          print(f"manifest expected: {expected}")
          print(f"hash check       : {status}")
          con = sqlite3.connect(db)
          quick = con.execute("PRAGMA quick_check").fetchone()[0]
          fk = con.execute("PRAGMA foreign_key_check").fetchall()
          print(f"quick_check      : {quick}")
          print(f"foreign_key_check: {len(fk)} violations")
          con.close()
          ok = (quick == "ok") and (len(fk) == 0) and (status == "PASS")
          if not ok:
              print(f"FATAL: catalog integrity failed", file=sys.stderr)
              sys.exit(1)
          print("catalog integrity: PASS")
          PYEOF

      # ── Gate 2: Source lock verification ──
      - name: Verify source locks
        run: |
          if [ -f tools/ir-data/verify_source_locks.py ]; then
            python3 tools/ir-data/verify_source_locks.py
          else
            echo "SKIP: verify_source_locks.py not found"
          fi

      # ── Gate 3: Python lint ──
      - name: Lint Python scripts (ruff)
        run: |
          pip install --break-system-packages ruff 2>/dev/null || pip install ruff
          ruff check tools/ir-data/*.py --select E,F,W --ignore E501,W505

      # ── Gate 4: JVM unit tests ──
      - name: Run JVM unit tests
        run: |
          cd apps/android
          ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      # ── Gate 5: Android lint ──
      - name: Lint (abort on error)
        run: |
          cd apps/android
          ./gradlew :app:lintDebug --console=plain --no-daemon

      # ── Gate 6: Debug build ──
      - name: Build debug APK
        run: |
          cd apps/android
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      # ── Gate 7: Release build (R8) ──
      - name: Build release APK (R8 minification)
        run: |
          cd apps/android
          ./gradlew :app:assembleRelease --console=plain --no-daemon

      # ── Gate 8: SBOM generation ──
      - name: Generate SBOM (CycloneDX)
        run: |
          cd apps/android
          ./gradlew :app:cyclonedxDirectBom --console=plain --no-daemon
          if [ -f app/build/reports/cyclonedx-direct/bom.xml ]; then
            cp app/build/reports/cyclonedx-direct/bom.xml "$GITHUB_WORKSPACE/sbom.xml"
            echo "SBOM generated successfully"
          else
            echo "ERROR: SBOM file not found after generation" >&2
            exit 1
          fi

      # ── Artifacts ──
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml
          if-no-files-found: error
          retention-days: 90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Report test count
        if: always()
        run: |
          cd apps/android
          total=$(find app/build/test-results -name "*.xml" -exec grep -oE 'tests="[0-9]+"' {} \; | awk -F'"' '{sum+=$2} END {print sum}')
          echo "Total tests: $total"

  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: apps/android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain --no-daemon
