name: Android CI

# Phase 1.19 — the project's first CI workflow.
#
# `MASTER_ORDER.md` §44 calls for every change to be
# measured: the test suite, the build, the lint. The
# workflow runs the two green-build gates (test +
# assemble) on every push and pull request. Lint is
# NOT a gate yet (Bug #17: the Compose Compiler
# 1.5.15 + Kotlin 2.0.21 detector stack is broken
# with `MutableCollectionMutableStateDetector`); the
# gate lands in Phase 2+ when the Compose Compiler
# upgrade is complete.
#
# The workflow uses a single job (`build`) on the
# cheapest Linux runner. The Gradle build is cached
# across runs (the `gradle-build-action` key).
#
# The workflow checks out the repository with
# `fetch-depth: 0` so the CI run can attach the
# change-set to a future release note. The `actions/setup-java@v4`
# step installs the JDK 17 that matches the
# project's `jvmToolchain(17)` in `app/build.gradle.kts`.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      - name: Run JVM unit tests
        run: |
          cd apps/android
          ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: |
          cd apps/android
          ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report test count
        if: always()
        run: |
          cd apps/android
          total=$(find app/build/test-results -name "*.xml" -exec grep -oE 'tests="[0-9]+"' {} \; | awk -F'"' '{sum+=$2} END {print sum}')
          echo "Total tests: $total"
