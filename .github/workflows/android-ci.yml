name: Android CI

# Phase 1.19 — the project's first CI workflow.
#
# `MASTER_ORDER.md` §44 calls for every change to be
# measured: the test suite, the build, the lint. The
# workflow runs the two green-build gates (test +
# assemble) on every push and pull request. Lint is
# NOT a gate yet (Bug #17: the Compose Compiler
# 1.5.15 + Kotlin 2.0.21 detector stack is broken
# with `MutableCollectionMutableStateDetector`); the
# gate lands in Phase 2+ when the Compose Compiler
# upgrade is complete.
#
# The workflow uses a single job (`build`) on the
# cheapest Linux runner. The Gradle build is cached
# across runs (the `gradle-build-action` key). The
# Android SDK is *not* cached; the cmdline-tools step
# is small enough to re-download on every run.
#
# The workflow checks out the repository with
# `fetch-depth: 0` so the CI run can attach the
# change-set to a future release note. The `actions/setup-java@v4`
# step installs the JDK 17 that matches the
# project's `jvmToolchain(17)` in `app/build.gradle.kts`.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The cmdline-tools version is the latest
          # stable that matches the project's
          # `compileSdk = 34` and `targetSdk = 34`.
          # The action accepts a `cmdline-tools`
          # version and a list of `packages` to
          # install via `sdkmanager`.
          cmdline-tools-version: 11076708
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android-controller/gradlew

      - name: Run JVM unit tests
        run: |
          cd apps/android-controller
          ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: |
          cd apps/android-controller
          ./gradlew :app:assembleDebug --console=plain

      - name: Verify hid-descriptor-validator
        run: |
          cd apps/android-controller
          ./gradlew :app:runValidator --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/android-controller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report test count
        if: always()
        run: |
          cd apps/android-controller
          total=$(find app/build/test-results -name "*.xml" -exec grep -oE 'tests="[0-9]+"' {} \; | awk -F'"' '{sum+=$2} END {print sum}')
          echo "Total tests: $total"
