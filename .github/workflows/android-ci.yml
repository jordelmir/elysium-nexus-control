name: Android CI

# Elysium Nexus — Android CI pipeline (full path)
#
# V06-P35: the FULL/authoritative pipeline runs on push to main/develop
# (and on demand via workflow_dispatch). PRs run the fast path
# (ci-fast.yml) — release gates (R8, SBOM, emulator) belong to pushes.
#
# Gates: catalog integrity → Python lint → device-matrix validation →
#        JVM tests → Android lint → debug build → release build (R8) →
#        SBOM → instrumented tests.
#
# §44: every change must be measured. This workflow enforces that
# on every push to main/develop.

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # V06.2 P0-1: ir_catalog.db lives in Git LFS; lfs: true is required
          # (actions/checkout default is false → pointer files break Gate 1).
          lfs: true

      # V06.2 P0-1: force LFS pull even if checkout's lfs flag is ignored.
      # Without this, ir_catalog.db is a 132-byte pointer → Gate 1 fails.
      - name: Force LFS pull
        run: |
          git lfs install
          git lfs pull
          # Verify the DB is a real SQLite file, not a pointer
          magic=$(xxd -l 16 -p apps/android/app/src/main/assets/ir/ir_catalog.db)
          if [ "$magic" = "53514c69746520666f726d6174203300" ]; then
            echo "LFS pull: PASS (real SQLite blob)"
          else
            echo "FATAL: ir_catalog.db is still an LFS pointer after git lfs pull" >&2
            echo "  magic: $magic" >&2
            exit 1
          fi

      - name: Git LFS sanity (fsck)
        run: |
          git lfs fsck
          test -s apps/android/app/src/main/assets/ir/ir_catalog.db
          echo "lfs fsck: PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      # ── Gate 1: Catalog integrity (LFS blob + hash + size + integrity) ──
      # V06.2 P0-1: the gate rejects an LFS pointer (SQLite magic) and ties
      # size + sha256 to the manifest authority.
      - name: Verify IR catalog integrity (quick_check + manifest hash)
        run: |
          cd apps/android/app/src/main/assets/ir
          python3 - <<'PYEOF'
          import hashlib, json, os, sqlite3, sys
          db = "ir_catalog.db"
          manifest = json.load(open("ir_catalog.manifest.json"))
          with open(db, "rb") as f:
              magic = f.read(16)
          pointer_ok = (magic == b"SQLite format 3\x00")
          size_ok = (os.path.getsize(db) == manifest.get("databaseSizeBytes"))
          sha = hashlib.sha256(open(db, "rb").read()).hexdigest()
          expected = manifest.get("databaseSha256")
          sha_ok = (expected is not None and sha == expected)
          print(f"lfs-pointer check : {'PASS' if pointer_ok else 'FAIL'} (SQLite magic)")
          print(f"size check        : {'PASS' if size_ok else 'FAIL'} "
                f"({os.path.getsize(db)} vs {manifest.get('databaseSizeBytes')})")
          print(f"catalog sha256    : {sha}")
          print(f"manifest expected : {expected}")
          print(f"hash check        : {'PASS' if sha_ok else 'FAIL'}")
          con = sqlite3.connect(db)
          quick = con.execute("PRAGMA quick_check").fetchone()[0]
          fk = con.execute("PRAGMA foreign_key_check").fetchall()
          print(f"quick_check       : {quick}")
          print(f"foreign_key_check : {len(fk)} violations")
          con.close()
          ok = pointer_ok and size_ok and sha_ok and (quick == "ok") and (len(fk) == 0)
          if not ok:
              print(f"FATAL: catalog integrity failed", file=sys.stderr)
              sys.exit(1)
          print("catalog integrity: PASS")
          PYEOF

      # ── Gate 1b: Canonical hash reproducibility ──
      - name: Verify canonical content hash matches manifest
        run: |
          python3 - <<'PYEOF'
          import json, sys
          sys.path.insert(0, "${{ github.workspace }}/tools/ir-data")
          from export_canonical_catalog import compute_canonical_hash
          from pathlib import Path
          db_path = Path("apps/android/app/src/main/assets/ir/ir_catalog.db")
          manifest = json.load(open("apps/android/app/src/main/assets/ir/ir_catalog.manifest.json"))
          expected = manifest.get("canonicalContentSha256")
          actual, _ = compute_canonical_hash(db_path)
          print(f"canonical expected: {expected}")
          print(f"canonical actual  : {actual}")
          if expected is None:
              print("FATAL: manifest missing canonicalContentSha256", file=sys.stderr)
              sys.exit(1)
          if actual != expected:
              print(f"FATAL: canonical hash mismatch", file=sys.stderr)
              sys.exit(1)
          print("canonical hash: PASS")
          PYEOF

      # ── Gate 2a: Source lock schema (V06.2 P0-2 — single authority) ──
      # validate_source_lock_schema.py is THE one implementation of the
      # lock policy (kind=git vs kind=artifact). No inline YAML validators.
      - name: Validate source lock schema
        run: |
          python3 tools/ir-data/validate_source_lock_schema.py

      # ── Gate 2b: Device-matrix validation (V06-P33) ──
      - name: Validate devices-under-test matrix
        run: |
          pip install --break-system-packages pyyaml 2>/dev/null || pip install pyyaml
          python3 tools/device-matrix/validate.py

      # ── Gate 2c: Catalog eligibility (V06-PTG-02 §3) ──
      - name: Enforce production catalog eligibility gate
        run: |
          python3 tools/ir-data/check_catalog_eligibility.py

      # ── Gate 3: Python lint ──
      - name: Lint Python scripts (ruff)
        run: |
          pip install --break-system-packages ruff 2>/dev/null || pip install ruff
          ruff check tools/ir-data/*.py --select E,F,W --ignore E501,W505,E402

      # ── Gate 4: JVM unit tests ──
      - name: Run JVM unit tests
        run: |
          cd apps/android
          ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      # ── Gate 5: Android lint ──
      - name: Lint (abort on error)
        run: |
          cd apps/android
          ./gradlew :app:lintDebug --console=plain --no-daemon

      # ── Gate 6: Debug build ──
      - name: Build debug APK
        run: |
          cd apps/android
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      # ── Gate 7: Release build (R8) moved to a SEPARATE job ⬇ ──
      # GitHub Actions does not allow the `secrets` context in a step-level
      # `if:` ("Unrecognized named-value: 'secrets'"). Regla Comercial Hard #9
      # (fail-closed, 0f39958): assembleRelease WITHOUT verified env
      # credentials throws. So the release gate lives in the `release` job
      # below, which runs ONLY when the repo secrets are provisioned
      # (job-level `if` may reference `secrets`). No unsigned release APK is
      # ever built when the credentials are absent.

      # ── Gate 8: SBOM generation ──
      - name: Generate SBOM (CycloneDX)
        run: |
          cd apps/android
          ./gradlew :app:cyclonedxDirectBom --console=plain --no-daemon
          if [ -f app/build/reports/cyclonedx-direct/bom.xml ]; then
            cp app/build/reports/cyclonedx-direct/bom.xml "$GITHUB_WORKSPACE/sbom.xml"
            echo "SBOM generated successfully"
          else
            echo "ERROR: SBOM file not found after generation" >&2
            exit 1
          fi

      # ── Artifacts ──
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml
          if-no-files-found: error
          retention-days: 90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Report test count
        if: always()
        run: |
          cd apps/android
          total=$(find app/build/test-results -name "*.xml" -exec grep -oE 'tests="[0-9]+"' {} \; | awk -F'"' '{sum+=$2} END {print sum}')
          echo "Total tests: $total"

  # ── Release job (R8 + signed APK) ─────────────────────────────────────
  # Gate 7 lives here, NOT in `build`: GitHub Actions forbids the `secrets`
  # context in step-level `if:`, but ALLOWS it at job level. Regla Comercial
  # Hard #9 (fail-closed, 0f39958): assembleRelease WITHOUT verified env
  # credentials throws GradleException — so this job only runs when the repo
  # secrets are provisioned; otherwise it is skipped and the pipeline stays
  # green, never producing an unsigned release APK.
  release:
    name: Release APK (R8 + signed)
    needs: build
    if: ${{ secrets.RELEASE_STORE_PASSWORD != '' && secrets.RELEASE_KEY_PASSWORD != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # V06.2 P0-1: force LFS pull (ir_catalog.db must be the real blob).
      - name: Force LFS pull
        run: |
          git lfs install
          git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      - name: Build release APK (R8 minification, signed)
        run: |
          cd apps/android
          ./gradlew :app:assembleRelease --console=plain --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  # ── Instrumented tests (DISABLED — v0.7 P0.3) ──────────────────────
  # WHY DISABLED:
  #   reactivecircus/android-emulator-runner@v2 crashes on GitHub Actions
  #   Ubuntu runners with "Emulator client has not yet been configured"
  #   and "step: Not implemented". Even with continue-on-error: true,
  #   the red X is visible and misleading. The real quality gate is the
  #   build job above (JVM tests + lint + debug/release APK + SBOM).
  #
  # RE-ENABLE WHEN:
  #   - GitHub Actions ships stable KVM-enabled runners, OR
  #   - We migrate to Firebase Test Lab / physical device farm, OR
  #   - reactivecircus/android-emulator-runner@v3 resolves boot issues.
